apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: waterlog
  name: postgres
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  bootstrap:
    initdb:
      database: waterlog
  storage:
    size: 10Gi

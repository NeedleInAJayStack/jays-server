apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waterlog
  namespace: waterlog
  labels:
    app: waterlog
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - waterlog.herron.dev
  rules:
    - backendRefs:
        - name: waterlog
          port: 8080

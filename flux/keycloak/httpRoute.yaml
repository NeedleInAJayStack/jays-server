apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - keycloak.herron.dev
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: "frame-ancestors 'self' https://keycloak.herron.dev; upgrade-insecure-requests; report-to cf-nel"
      backendRefs:
        - name: keycloak-service
          port: 8080

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: keycloak
  name: postgres
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 17
  bootstrap:
    initdb:
      database: keycloak
  storage:
    size: 10Gi

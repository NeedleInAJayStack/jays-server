apiVersion: batch/v1
kind: CronJob
metadata:
  name: public-ip-updater
  namespace: envoy-gateway
  labels:
    app: public-ip-updater
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: public-ip-updater
        spec:
          serviceAccountName: public-ip-updater
          restartPolicy: OnFailure
          containers:
            - name: updater
              image: bitnami/kubectl
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  PUBLIC_IP=$(curl -sf --max-time 10 ifconfig.me)
                  if [ -z "$PUBLIC_IP" ]; then
                    PUBLIC_IP=$(curl -sf --max-time 10 -4 icanhazip.com)
                  fi
                  if [ -z "$PUBLIC_IP" ]; then
                    echo "ERROR: failed to determine public IP"
                    exit 1
                  fi
                  echo "Public IP: $PUBLIC_IP"

                  CURRENT=$(kubectl -n envoy-gateway get gateway envoy \
                    -o jsonpath='{.metadata.annotations.external-dns\.kubernetes\.io/target}')
                  echo "Current target: [${CURRENT}]"

                  if [ "$CURRENT" = "$PUBLIC_IP" ]; then
                    echo "Gateway already targets $PUBLIC_IP. Nothing to do."
                    exit 0
                  fi

                  echo "Updating Gateway target to $PUBLIC_IP"
                  kubectl -n envoy-gateway annotate gateway envoy --overwrite \
                    "external-dns.kubernetes.io/target=$PUBLIC_IP"
                  echo "Done."
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

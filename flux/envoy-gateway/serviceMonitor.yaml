apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: envoy-gateway
  endpoints:
    - path: /metrics
      port: metrics
  namespaceSelector:
    matchNames:
      - envoy-gateway

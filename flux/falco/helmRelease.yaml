apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  chart:
    spec:
      chart: falco
      sourceRef:
        kind: HelmRepository
        name: falco
      version: '<10.0.0'
  interval: 10m
  # See https://github.com/falcosecurity/charts/blob/master/charts/falco/values.yaml
  values:
    falcosidekick:
      enabled: true
      config:
        alertmanager:
          hostport: "http://prometheus-kube-prometheus-alertmanager.prometheus:9093"
          endpoint: "/api/v2/alerts"
      serviceMonitor:
        enabled: true
    metrics:
      enabled: true
    serviceMonitor:
      create: true

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
      version: '<2.0.0'
  interval: 10m
  # See https://github.com/goharbor/harbor-helm/blob/main/values.yaml
  values:
    expose:
      type: route
      tls:
        enabled: false # TLS terminates at Envoy Gateway
      route:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        parentRefs:
          - name: envoy
            namespace: envoy-gateway
            sectionName: https
        hosts:
          - harbor.herron.dev
    externalURL: https://harbor.herron.dev
    logLevel: warning

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rallly
  namespace: rallly
  labels:
    app: rallly
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - rallly.herron.dev
  rules:
    - backendRefs:
        - name: rallly
          port: 3000

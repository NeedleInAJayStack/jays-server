apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# This automatically adds SOPS decryption to the flux-system kustomization
# when `flux bootstrap` is called, avoiding a chicken/egg.
- path: patch-decryption.yaml
  target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: flux-system
    namespace: flux-system

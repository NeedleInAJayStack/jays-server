# Periodically backs up the SQLite file into a directory on the same persistent volume.
# This enables db recovery from a volume snapshot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: vaultwarden
spec:
  schedule: '0 4 * * *'
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sqlite-backup
              image: keinos/sqlite3:3.53.4
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  umask 027
                  backup_dir=/data/backups
                  mkdir -p "$backup_dir"
                  retention_days=30
                  find "$backup_dir" -type f -name 'vaultwarden-*.sqlite' -mtime +$retention_days -delete
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  temporary_file="$backup_dir/.vaultwarden-$stamp.sqlite.tmp"
                  backup_file="$backup_dir/vaultwarden-$stamp.sqlite"
                  trap 'rm -f "$temporary_file"' EXIT
                  sqlite3 /data/db.sqlite3 ".backup '$temporary_file'"
                  if test "$(sqlite3 "$temporary_file" 'PRAGMA integrity_check;')" != ok; then
                    printf 'SQLite integrity check failed\n' >&2
                    exit 1
                  fi
                  mv "$temporary_file" "$backup_file"
              volumeMounts:
                - name: application-data
                  mountPath: /data
          volumes:
            - name: application-data
              persistentVolumeClaim:
                claimName: vaultwarden

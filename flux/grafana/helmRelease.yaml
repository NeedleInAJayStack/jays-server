apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
      version: '<13.0.0'
  interval: 10m
  # Defaults: https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  values:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1536Mi
    envFromSecret: grafana-oauth
    grafana.ini:
      server:
        root_url: https://grafana.herron.dev
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        client_id: grafana
        client_secret: $__env{client_secret}
        scopes: openid email profile offline_access roles
        auth_url: https://keycloak.herron.dev/realms/herrondev/protocol/openid-connect/auth
        token_url: https://keycloak.herron.dev/realms/herrondev/protocol/openid-connect/token
        api_url: https://keycloak.herron.dev/realms/herrondev/protocol/openid-connect/userinfo
        use_pkce: true
        role_attribute_path: "'Admin'"
    persistence:
      enabled: true
    serviceMonitor:
      enabled: true
    route:
      main:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - grafana.herron.dev
        parentRefs:
          - name: envoy
            namespace: envoy-gateway
            sectionName: https

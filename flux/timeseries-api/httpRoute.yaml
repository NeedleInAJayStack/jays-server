apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeseries-api
  namespace: timeseries-api
  labels:
    app: timeseries-api
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - data.herron.dev
    - utility-api.herron.dev
  rules:
    - backendRefs:
        - name: timeseries-api
          port: 80

apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  namespace: timeseries-api
  name: cluster
spec:
  postgres:
    version: '17'
    extensions:
      - name: timescaledb_tsl
        version: "2.21.3"
      - name: uuid-ossp
        version: "1.1"
  instances: 1
  pods:
    updateStrategy:
      type: Schedule
      method: InPlace
      schedule:
        # 1–5 AM America/Denver; hourly windows preserve the cutoff across DST.
        - cron: "0 1-4 * * *"
          duration: PT1H
    persistentVolume:
      size: '10Gi'
  configurations:
    sgPostgresConfig: postgres-config
    observability:
      prometheusAutobind: true

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: timeseries-api
  name: postgres
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  bootstrap:
    initdb:
      database: timeseries_api
  storage:
    size: 10Gi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  namespace: timeseries-api
  name: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
  - port: metrics

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: opencost
spec:
  chart:
    spec:
      chart: opencost
      sourceRef:
        kind: HelmRepository
        name: opencost
      version: '<3.0.0'
  interval: 10m
  # See https://github.com/opencost/opencost-helm-chart/blob/main/charts/opencost/values.yaml
  values:
    opencost:
      prometheus:
        internal:
          namespaceName: prometheus
          serviceName: prometheus-kube-prometheus-prometheus
          port: 9090
      customPricing:
        enabled: true
        costModel:
          description: "Local cost, but aligned to GKE Standard us-central1: N2 and zonal balanced PD"
          CPU: "0.031611"          # per vCPU-hour, N2
          RAM: "0.004237"          # per GiB-hour, N2
          spotCPU: "0.01896"       # per vCPU-hour, N2 Spot; prices vary
          spotRAM: "0.002542"      # per GiB-hour, N2 Spot; prices vary
          GPU: "0.35"              # per T4 GPU-hour on a separate N1 node
          storage: "0.000136986"   # per GiB-hour, $0.10/GiB-month / 730 hours
          zoneNetworkEgress: "0.01"      # per GiB, between zones
          regionNetworkEgress: "0.02"    # per GiB, between North American regions
          internetNetworkEgress: "0.12"  # per GiB, Premium Tier to North America
      metrics:
        kubeStateMetrics:
          emitKsmV1Metrics: false
          emitKsmV1MetricsOnly: false
        serviceMonitor:
          enabled: true
      ui:
        httpRoute:
          enabled: true
          parentRefs:
            - name: envoy
              namespace: envoy-gateway
              sectionName: https
          hostnames:
            - opencost.herron.dev
          annotations:
            external-dns.kubernetes.io/cloudflare-proxied: "true"

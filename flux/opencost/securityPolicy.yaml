# Requires that KeyCloak's herrondev realm has been configured with a prometheus OIDC client
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opencost-oidc
  namespace: opencost
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: opencost-ui
  oidc:
    provider:
      issuer: https://keycloak.herron.dev/realms/herrondev
    clientID: opencost
    clientSecret:
      name: opencost-oidc
    redirectURL: https://opencost.herron.dev/oauth2/callback
    logoutPath: /logout

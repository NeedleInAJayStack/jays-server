apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: '<95.0.0'
  interval: 10m
  # See https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      ingress:
        enabled: false
      config:
        route:
          routes:
            - receiver: 'null'
              matchers:
                - 'alertname = Watchdog'
            - receiver: telegram-critical
              matchers:
                - 'severity = critical'
        receivers:
          - name: 'null'
          - name: telegram-critical
            telegram_configs:
              - chat_id: -4577127833
                bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                send_resolved: true
      alertmanagerSpec:
        externalUrl: https://alertmanager.herron.dev
        secrets:
          - alertmanager-telegram
    grafana:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        externalUrl: https://prometheus.herron.dev
        resources:
          requests:
            cpu: 250m
            memory: 3Gi
          limits:
            cpu: "1"
            memory: 4Gi
        podMonitorSelectorNilUsesHelmValues: false # Collects all PodMonitors in all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false # Collects all ServiceMonitors in all namespaces
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
    kubeControllerManager:
      endpoints:
        - 192.168.4.100
    # MicroK8s runs kube-proxy inside kubelite with loopback-only metrics.
    kubeProxy:
      enabled: false
    kubeScheduler:
      endpoints:
        - 192.168.4.100

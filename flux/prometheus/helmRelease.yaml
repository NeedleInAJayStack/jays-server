apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: '<86.0.0'
  interval: 10m
  # See https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    grafana:
      enabled: false
    alertmanager:
      ingress:
        enabled: false
      alertmanagerSpec:
        externalUrl: https://alertmanager.herron.dev
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        externalUrl: https://prometheus.herron.dev
        resources:
          requests:
            cpu: 250m
            memory: 3Gi
          limits:
            cpu: "1"
            memory: 4Gi
        podMonitorSelectorNilUsesHelmValues: false # Collects all PodMonitors in all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false # Collects all ServiceMonitors in all namespaces
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi

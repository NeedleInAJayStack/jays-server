apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radicale
  namespace: radicale
  labels:
    app: radicale
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - cal.herron.dev
    - radicale.herron.dev
  rules:
    - backendRefs:
        - name: radicale
          port: 5232

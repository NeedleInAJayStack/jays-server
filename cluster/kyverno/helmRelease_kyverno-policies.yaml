apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno-policies
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: '<4.0.0'
  interval: 10m
  # See https://github.com/kyverno/kyverno/blob/main/charts/kyverno-policies/values.yaml
  values:
    vpolExcludeByPolicy:
      disallow-host-namespaces:
        excludeNamespaces:
          - home-assistant
          - kube-system
          - openebs
          - prometheus
      disallow-host-path:
        excludeNamespaces:
          - falco
          - kube-system
          - openebs
          - prometheus
      disallow-host-ports:
        excludeNamespaces:
          - ingress
          - opentelemetry-collector
          - openebs
          - plex
          - prometheus
      disallow-privileged-containers:
        excludeNamespaces:
          - falco
          - home-assistant
          - kube-system
          - openebs
          - plex
          - prometheus

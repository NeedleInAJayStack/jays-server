apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  namespace: health-db
  name: cluster
spec:
  postgres:
    version: '17'
  instances: 1
  pods:
    persistentVolume:
      size: '10Gi'
  configurations:
    sgPostgresConfig: postgres-config
    backups:
      - sgObjectStorage: seaweedfs-backups
        cronSchedule: '15 3 * * *'
    observability:
      prometheusAutobind: true
